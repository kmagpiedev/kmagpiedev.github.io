<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>인터넷에 연결되어 있지 않습니다 | 까치툴</title>
<style>
  :root{--bg:#faf9f7;--surface:#fff;--line:#e6e2dc;--ink:#22201d;--ink-2:#57524b;--ink-3:#8a837a;--accent:#b45309}
  @media (prefers-color-scheme:dark){
    :root{--bg:#171614;--surface:#201f1c;--line:#33312d;--ink:#ece9e4;--ink-2:#aca69d;--ink-3:#7d776e;--accent:#e0a35a}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);line-height:1.75;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif}
  .wrap{max-width:520px;margin:0 auto;padding:90px 22px;text-align:center}
  img{width:96px;height:96px;margin:0 0 18px}
  h1{font-size:22px;letter-spacing:-.015em;margin:0 0 12px}
  p{font-size:15px;color:var(--ink-2);margin:0 0 12px;word-break:keep-all}
  .btn{display:inline-block;margin-top:14px;padding:11px 20px;border-radius:10px;border:1px solid var(--accent);
    background:var(--accent);color:#fff;font-size:15px;font-weight:700;text-decoration:none;cursor:pointer;font-family:inherit}
  .note{font-size:13px;color:var(--ink-3);margin-top:26px}
</style>
</head>
<body>
<div class="wrap">
  <img src="/images/icon-192.png" alt="까치툴">
  <h1>인터넷에 연결되어 있지 않습니다</h1>
  <p>이 페이지는 아직 기기에 저장되지 않았습니다. 연결이 돌아오면 다시 열 수 있어요.</p>
  <p class="note">한 번 열어 본 도구는 인터넷 없이도 그대로 작동합니다. 파일 처리는 원래 모두 브라우저 안에서 이뤄지기 때문입니다.</p>
  <a class="btn" href="javascript:location.reload()">다시 시도</a>
</div>
</body>
</html>
