<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#06142b" />
  <meta name="description" content="균열: 빛의 매듭 — K-MAGPIE의 실시간 미디어아트." />
  <meta property="og:title" content="균열: 빛의 매듭 — K-MAGPIE" />
  <meta property="og:description" content="꽃살문을 비춘 달빛이 오방의 실로 풀리고, 까치가 되어 우주의 균열을 매듭으로 잇는다." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://www.kmagpie.com/images/kmagpie-og.png" />
  <title>균열: 빛의 매듭 — K-MAGPIE</title>
  <link rel="icon" href="/images/favicon.png" />
  <link rel="stylesheet" href="./styles.css?v=3" />
</head>
<body>
  <main id="artwork" aria-label="균열: 빛의 매듭">
    <canvas id="scene" aria-hidden="true"></canvas>
    <div id="film-grain" aria-hidden="true"></div>
    <div id="edge-vignette" aria-hidden="true"></div>

    <section id="intro" class="overlay" aria-labelledby="title">
      <div class="intro-inner">
        <div class="brand">
          <img src="/images/favicon.png" alt="" />
          <span>K-MAGPIE · MEDIA ART 002</span>
        </div>
        <p class="kicker" data-i18n="kicker">한국의 빛으로 다시 잇는 우주</p>
        <h1 id="title"><span data-i18n="title">균열: 빛의 매듭</span><small>RIFT: KNOT OF LIGHT</small></h1>
        <p class="concept" data-i18n="concept">꽃살문을 비춘 달빛이 오방의 실로 풀리고,<br>까치가 되어 우주의 균열을 매듭으로 잇는다.</p>
        <button id="start" type="button" data-i18n="start">작품 시작</button>
        <p class="hint" data-i18n="hint">소리와 함께 감상해 주세요 · 60초</p>
      </div>
    </section>

    <section id="credit" aria-hidden="true">
      <p>K-MAGPIE · 2026</p>
      <h2><span data-i18n="title">균열: 빛의 매듭</span></h2>
      <small>RIFT: KNOT OF LIGHT</small>
      <blockquote data-i18n="ending">갈라진 틈은 사라지지 않는다.<br>우리는 그 사이에 빛을 잇는다.</blockquote>
    </section>

    <nav id="controls" aria-label="작품 제어">
      <button id="replay" type="button" aria-label="다시 재생">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66L20 8M20 4v4h-4"/></svg>
        <span data-i18n="replay">다시</span>
      </button>
      <button id="fullscreen" type="button" aria-label="전체화면">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
        <span data-i18n="fullscreen">전체화면</span>
      </button>
      <button id="mute" type="button" aria-label="음소거">
        <svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5ZM15 9a4 4 0 0 1 0 6M17.5 6.5a8 8 0 0 1 0 11"/></svg>
        <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5ZM16 9l5 6M21 9l-5 6"/></svg>
        <span data-i18n="mute">음소거</span>
      </button>
    </nav>

    <div id="progress" aria-hidden="true"><span></span></div>

    <aside id="debug" hidden>
      <label>TIME <output id="debug-time">0.00</output></label>
      <input id="timeline" type="range" min="0" max="60" step="0.01" value="0" />
      <button id="debug-play" type="button">PLAY / PAUSE</button>
    </aside>
  </main>
  <script src="./app.js?v=3"></script>
</body>
</html>
