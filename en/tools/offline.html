<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>You are offline | K-magpie Tools</title>
<style>
  :root{--bg:#faf9f7;--surface:#fff;--line:#e6e2dc;--ink:#22201d;--ink-2:#57524b;--ink-3:#8a837a;--accent:#b45309}
  @media (prefers-color-scheme:dark){
    :root{--bg:#171614;--surface:#201f1c;--line:#33312d;--ink:#ece9e4;--ink-2:#aca69d;--ink-3:#7d776e;--accent:#e0a35a}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);line-height:1.75;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:520px;margin:0 auto;padding:90px 22px;text-align:center}
  img{width:96px;height:96px;margin:0 0 18px}
  h1{font-size:22px;letter-spacing:-.015em;margin:0 0 12px}
  p{font-size:15px;color:var(--ink-2);margin:0 0 12px}
  .btn{display:inline-block;margin-top:14px;padding:11px 20px;border-radius:10px;border:1px solid var(--accent);
    background:var(--accent);color:#fff;font-size:15px;font-weight:700;text-decoration:none;cursor:pointer;font-family:inherit}
  .note{font-size:13px;color:var(--ink-3);margin-top:26px}
</style>
</head>
<body>
<div class="wrap">
  <img src="/images/icon-192.png" alt="K-magpie Tools">
  <h1>You are offline</h1>
  <p>This page has not been saved to your device yet. Open it again once you are back online.</p>
  <p class="note">Any tool you have opened before keeps working without a connection — all the processing happens inside your browser anyway.</p>
  <a class="btn" href="javascript:location.reload()">Try again</a>
</div>
</body>
</html>
